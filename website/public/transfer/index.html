<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>文件互传邀请 · 小羊便签</title>
<link rel="icon" href="/assets/sheep-4c6c2762.ico" sizes="any">
<link rel="stylesheet" href="/assets/site-v2.css">
<script src="/transfer/invite.js" defer></script>
</head>
<body class="auth-page">
<header class="site-header auth-header"><div class="wrap header-inner"><a class="brand" href="/"><img src="/assets/sheep-4c6c2762.ico" width="36" height="36" alt=""><span>小羊便签 <small>KimNotes</small></span></a></div></header>
<main class="wrap auth-main" id="main">
  <section class="auth-form-panel" aria-labelledby="invite-title">
    <h1 id="invite-title">文件互传邀请</h1>
    <p class="auth-subtitle">用小羊便签桌面版接收文件。</p>
    <button class="button button-primary auth-submit" id="copy-invitation" type="button" hidden>复制邀请</button>
    <p class="form-status" id="invitation-status" role="status" hidden></p>
    <div class="auth-preview"><p>复制邀请后，在桌面版选择「桌面工具 → 文件互传 → 接收 → 打开邀请」。</p></div>
    <noscript><p class="form-status">可从地址栏复制完整邀请链接。</p></noscript>
  </section>
</main>
</body>
</html>
