<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="same-origin">
<title>登录 · 小羊便签 KimNotes</title>
<link rel="icon" href="/assets/sheep.ico" sizes="any">
<link rel="stylesheet" href="/assets/site-v2.css?v=20261023-session">
<script src="/assets/site-v2.js?v=20261023-session" defer></script>
</head>
<body class="auth-page" data-page="auth">
<a class="skip-link" href="#main">跳到登录表单</a>
<header class="site-header auth-header"><div class="wrap header-inner"><a class="brand" href="/"><img src="/assets/sheep.ico" width="36" height="36" alt=""><span>小羊便签 <small>KimNotes</small></span></a><a class="text-link" href="/"><img class="icon" src="/assets/icons/arrow_back.svg" alt="">返回官网</a></div></header>
<main class="wrap auth-main" id="main">
  <section class="auth-form-panel" aria-labelledby="auth-title">
    <h1 id="auth-title">登录小羊便签</h1>
    <p class="auth-subtitle" id="auth-subtitle">登录后，查看你已同步的便签。</p>
    <div class="session-check" id="auth-session-check" role="status"><p id="auth-session-message">正在检查登录状态…</p><button class="text-link" id="auth-session-retry" type="button" hidden>重新检查</button></div>
    <div id="auth-content" hidden>
    <form id="auth-form" action="/login/" method="get">
      <label class="field"><span class="field-label">邮箱</span><input id="auth-email" type="email" placeholder="你的邮箱地址" autocomplete="username" inputmode="email" maxlength="254" required aria-describedby="auth-preview-note"></label>
      <label class="field" id="password-field"><span class="field-label" id="password-label">密码</span><span class="password-control"><input id="auth-password" aria-labelledby="password-label" type="password" placeholder="输入密码" autocomplete="off" maxlength="128" required><button class="icon-button" type="button" data-toggle-password aria-label="显示密码" aria-pressed="false"><img class="icon" src="/assets/icons/visibility.svg" alt=""></button></span></label>
      <label class="field" id="confirm-field" hidden><span class="field-label">确认密码</span><input id="auth-confirm" type="password" placeholder="再次输入密码" autocomplete="new-password" maxlength="128" disabled></label>
      <label class="field" id="code-field" hidden><span class="field-label">邮箱验证码</span><input id="auth-code" type="text" placeholder="6 位验证码" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" disabled></label>
      <div class="auth-options" id="auth-options"><a href="/login/?mode=reset" data-auth-mode="reset">忘记密码？</a></div>
      <div class="human-verification" id="human-verification"><div id="turnstile-widget"></div><p id="verification-message" role="status">正在加载人机验证…</p><button class="text-link" id="verification-retry" type="button" hidden>重新加载验证</button></div>
      <button class="button button-primary auth-submit" id="auth-submit" type="submit" disabled>登录</button>
      <p class="form-status" id="auth-status" role="status" hidden></p>
    </form>
    <p class="auth-switch" id="auth-switch">还没有账号？<a href="/login/?mode=register" data-auth-mode="register">注册账号</a></p>
    <div class="auth-preview"><p id="auth-preview-note">30 分钟无操作或登录满 8 小时后需重新登录。公共电脑使用后请退出账号。</p></div>
    </div>
    <noscript><p class="form-status">请启用 JavaScript 使用账号服务。</p></noscript>
  </section>
</main>
<footer class="auth-footer">小羊便签 KimNotes · 让记录简单一点</footer>
</body>
</html>
